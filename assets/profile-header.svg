<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Ayush Goel</title>
  <desc id="description">Animated neon profile header for a backend engineer and applied AI builder.</desc>

  <style>
    .name {
      font: 800 72px "Segoe UI", Inter, Arial, sans-serif;
      letter-spacing: 1px;
      transition: letter-spacing 450ms ease, filter 450ms ease;
    }
    .eyebrow {
      font: 700 14px "Segoe UI", Inter, Arial, sans-serif;
      letter-spacing: 7px;
    }
    .subtitle {
      font: 600 19px "Segoe UI", Inter, Arial, sans-serif;
      letter-spacing: 4px;
    }
    .pill-text {
      font: 700 12px "Segoe UI", Inter, Arial, sans-serif;
      letter-spacing: 2px;
    }
    .grid {
      animation: grid-drift 14s linear infinite;
    }
    .scanline {
      animation: scan 5s ease-in-out infinite;
    }
    .ring-a {
      transform-origin: 1040px 78px;
      animation: spin 15s linear infinite;
    }
    .ring-b {
      transform-origin: 1040px 78px;
      animation: spin-reverse 11s linear infinite;
    }
    .pulse {
      animation: pulse 2.8s ease-in-out infinite;
    }
    svg:hover .name {
      letter-spacing: 7px;
      filter: url(#strong-glow);
    }
    svg:hover .hover-bright {
      opacity: 1;
    }
    @keyframes grid-drift {
      to { transform: translate(36px, 36px); }
    }
    @keyframes scan {
      0%, 100% { transform: translateY(-36px); opacity: 0; }
      18%, 82% { opacity: .65; }
      50% { transform: translateY(320px); opacity: .35; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      to { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .grid, .scanline, .ring-a, .ring-b, .pulse { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="28" />
    </clipPath>

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816">
        <animate attributeName="stop-color" values="#050816;#16052E;#050816" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.48" stop-color="#0A1637">
        <animate attributeName="stop-color" values="#0A1637;#042B3A;#23103D;#0A1637" dur="11s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#090313">
        <animate attributeName="stop-color" values="#090313;#201000;#090313" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2BD6">
        <animate attributeName="stop-color" values="#FF2BD6;#7B61FF;#00E5FF;#FF2BD6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.34" stop-color="#7B61FF">
        <animate attributeName="stop-color" values="#7B61FF;#00E5FF;#B8FF2C;#7B61FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.68" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#B8FF2C;#FF9F1C;#00E5FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#B8FF2C">
        <animate attributeName="stop-color" values="#B8FF2C;#FF9F1C;#FF2BD6;#B8FF2C" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="pink-orb">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity=".95" />
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan-orb">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".9" />
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lime-orb">
      <stop offset="0" stop-color="#B8FF2C" stop-opacity=".75" />
      <stop offset="1" stop-color="#B8FF2C" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#8BE9FD" stroke-opacity=".11" stroke-width="1" />
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="36" />
    </filter>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="strong-glow" x="-40%" y="-70%" width="180%" height="240%">
      <feGaussianBlur stdDeviation="11" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)" />

    <g filter="url(#blur)" opacity=".9">
      <circle cx="170" cy="265" r="190" fill="url(#pink-orb)">
        <animate attributeName="cx" values="130;290;130" dur="10s" repeatCount="indefinite" />
        <animate attributeName="cy" values="270;205;270" dur="8s" repeatCount="indefinite" />
      </circle>
      <circle cx="780" cy="10" r="210" fill="url(#cyan-orb)">
        <animate attributeName="cx" values="760;930;760" dur="12s" repeatCount="indefinite" />
        <animate attributeName="cy" values="20;115;20" dur="9s" repeatCount="indefinite" />
      </circle>
      <circle cx="1110" cy="290" r="170" fill="url(#lime-orb)">
        <animate attributeName="cx" values="1100;970;1100" dur="11s" repeatCount="indefinite" />
      </circle>
    </g>

    <rect class="grid" x="-36" y="-36" width="1272" height="392" fill="url(#grid)" />
    <rect class="scanline" width="1200" height="2" fill="url(#neon)" filter="url(#glow)" />

    <g opacity=".75">
      <circle cx="90" cy="72" r="3" fill="#FF2BD6" class="pulse" />
      <circle cx="135" cy="116" r="2" fill="#00E5FF" class="pulse" style="animation-delay:.7s" />
      <circle cx="1080" cy="235" r="3" fill="#B8FF2C" class="pulse" style="animation-delay:1.2s" />
      <circle cx="1128" cy="190" r="2" fill="#FF9F1C" class="pulse" style="animation-delay:1.8s" />
      <circle cx="305" cy="55" r="2" fill="#7B61FF" class="pulse" style="animation-delay:2.2s" />
      <circle cx="875" cy="270" r="2" fill="#00E5FF" class="pulse" style="animation-delay:2.5s" />
    </g>

    <g fill="none" opacity=".7">
      <circle class="ring-a" cx="1040" cy="78" r="45" stroke="url(#neon)" stroke-width="2" stroke-dasharray="8 13" />
      <circle class="ring-b" cx="1040" cy="78" r="31" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3 9" />
      <circle cx="1040" cy="78" r="5" fill="#F8FAFC" stroke="#FF2BD6" stroke-width="3" class="pulse" />
    </g>

    <path d="M70 44 H350" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" opacity=".8" />
    <path d="M850 276 H1130" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" opacity=".8" />

    <text x="600" y="68" text-anchor="middle" class="eyebrow" fill="#D8E2FF">ENGINEER  ·  RESEARCHER  ·  PROBLEM SOLVER</text>
    <text x="600" y="157" text-anchor="middle" class="name" fill="url(#neon)" filter="url(#glow)">Ayush Goel</text>
    <text x="600" y="195" text-anchor="middle" class="subtitle" fill="#F8FAFC">BACKEND SYSTEMS  ·  APPLIED AI  ·  ALGORITHMS</text>

    <g transform="translate(385 225)">
      <g>
        <rect width="126" height="38" rx="19" fill="#FF2BD6" fill-opacity=".13" stroke="#FF2BD6" stroke-opacity=".75" />
        <text x="63" y="24" text-anchor="middle" class="pill-text" fill="#FF8BE7">BUILD</text>
      </g>
      <g transform="translate(152 0)">
        <rect width="126" height="38" rx="19" fill="#00E5FF" fill-opacity=".12" stroke="#00E5FF" stroke-opacity=".75" />
        <text x="63" y="24" text-anchor="middle" class="pill-text" fill="#72F1FF">MEASURE</text>
      </g>
      <g transform="translate(304 0)">
        <rect width="126" height="38" rx="19" fill="#B8FF2C" fill-opacity=".11" stroke="#B8FF2C" stroke-opacity=".75" />
        <text x="63" y="24" text-anchor="middle" class="pill-text" fill="#D5FF82">SCALE</text>
      </g>
    </g>

    <rect class="hover-bright" x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".65" style="transition:opacity 400ms ease" />
  </g>
</svg>
