<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Ayush Goel</title>
  <desc id="description">Professional profile header for a software engineer focused on backend systems, algorithms, and applied AI.</desc>

  <style>
    .name {
      font: 700 66px "Segoe UI", Inter, Arial, sans-serif;
      letter-spacing: -1px;
    }
    .eyebrow {
      font: 600 13px "Segoe UI", Inter, Arial, sans-serif;
      letter-spacing: 4px;
    }
    .subtitle {
      font: 400 20px "Segoe UI", Inter, Arial, sans-serif;
      letter-spacing: .5px;
    }
    .label {
      font: 600 12px "Segoe UI", Inter, Arial, sans-serif;
      letter-spacing: 1.5px;
    }
    .monogram {
      font: 700 180px "Segoe UI", Inter, Arial, sans-serif;
      letter-spacing: -12px;
    }
    .accent-bar {
      animation: breathe 4.5s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: .65; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .accent-bar { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="frame">
      <rect width="1200" height="280" rx="20" />
    </clipPath>

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111F" />
      <stop offset=".55" stop-color="#10213A" />
      <stop offset="1" stop-color="#0B1728" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset=".55" stop-color="#60A5FA" />
      <stop offset="1" stop-color="#818CF8" />
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8CA3C2" stroke-opacity=".08" stroke-width="1" />
    </pattern>

    <filter id="soft-glow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#background)" />
    <rect width="1200" height="280" fill="url(#grid)" />

    <circle cx="1080" cy="20" r="250" fill="#2563EB" fill-opacity=".06" />
    <circle cx="1120" cy="40" r="170" fill="none" stroke="#60A5FA" stroke-opacity=".1" stroke-width="1" />

    <text x="900" y="208" class="monogram" fill="none" stroke="#93C5FD" stroke-opacity=".1" stroke-width="2">AG</text>

    <rect x="72" y="42" width="104" height="4" rx="2" fill="url(#accent)" class="accent-bar" filter="url(#soft-glow)">
      <animate attributeName="width" values="104;168;104" dur="6s" repeatCount="indefinite" />
    </rect>

    <text x="72" y="78" class="eyebrow" fill="#93C5FD">SOFTWARE ENGINEERING  ·  IIT KHARAGPUR</text>
    <text x="68" y="151" class="name" fill="#F8FAFC">Ayush Goel</text>
    <text x="72" y="190" class="subtitle" fill="#CBD5E1">Building reliable backend systems and practical AI products.</text>

    <line x1="72" y1="220" x2="1128" y2="220" stroke="#64748B" stroke-opacity=".35" />
    <rect x="72" y="219" width="180" height="2" rx="1" fill="url(#accent)">
      <animate attributeName="x" values="72;948;72" dur="12s" repeatCount="indefinite" />
    </rect>

    <circle cx="76" cy="249" r="4" fill="#38BDF8" />
    <text x="91" y="253" class="label" fill="#CBD5E1">BACKEND SYSTEMS</text>

    <circle cx="285" cy="249" r="4" fill="#60A5FA" />
    <text x="300" y="253" class="label" fill="#CBD5E1">ALGORITHMS</text>

    <circle cx="435" cy="249" r="4" fill="#818CF8" />
    <text x="450" y="253" class="label" fill="#CBD5E1">APPLIED AI</text>

    <rect x="1" y="1" width="1198" height="278" rx="19" fill="none" stroke="#334155" stroke-width="2" />
  </g>
</svg>
